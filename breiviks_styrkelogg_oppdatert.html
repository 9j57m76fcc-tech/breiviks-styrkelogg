<body>
<main><h1>Breiviks styrkelogg 💪</h1><p id="load-status">Åpner Styrkeloggen …</p><button id="retry" type="button" hidden>Prøv igjen</button></main>
<script>
'use strict';
// Load original application and apply activity, family-view and editable exercise updates.
// The original application stays intact, including its account and database settings.
const ORIGINAL='https://raw.githubusercontent.com/9j57m76fcc-tech/breiviks-styrkelogg/64536e94c852b1a04f8874c75bda3bc68ae00c85/index.html';
const replacements=[
 ['Hver registrerte aktivitet over 30 minutter gir 5 poeng.','Hver registrerte aktivitet på 20 minutter eller mer gir 5 poeng.'],
 ['Over 30 minutter gir 5 poeng.','20 minutter eller mer gir 5 poeng.'],
 ['<option value="Annet">✨ Annet</option>','<option value="Turn">🤸 Turn</option><option value="Annet">✨ Annet</option>'],
 ['Number(r.duration_minutes)>30?5:0','Number(r.duration_minutes)>=20?5:0'],
 ['activityBonusMinutes()>30?5:0','activityBonusMinutes()>=20?5:0'],
 ["duration>30?'Du får 5 poeng.':'Denne økten ga ingen poeng (30 minutter eller kortere).'","duration>=20?'Du får 5 poeng.':'Denne økten ga ingen poeng (under 20 minutter).'"],
 ["Number(w.duration_minutes)>30?'Aktivitetsbonus':'Kort økt'","Number(w.duration_minutes)>=20?'Aktivitetsbonus':'Kort økt'"],
 // New member profile screen shown only to signed-in members of the same family.
 ['<div id="profilePage" class="hidden">', `<div id="memberPage" class="hidden"><div class="card"><div class="row"><h2 id="memberTitle">Treningsøkter</h2><button type="button" class="tiny secondary" id="memberBack">Tilbake</button></div><p>Treningsøkter og bilder som er delt med familien.</p><div id="memberHistory" class="history-list"></div></div></div><div id="profilePage" class="hidden">`],
 ["'league','profile'])$(x+'Page')", "'league','profile','member'])$(x+'Page')"],
 ["pts[id]={name:(members.data||[])", "pts[id]={id,name:(members.data||[])"],
 ["pts[w.user_id]={name:'Familiemedlem'", "pts[w.user_id]={id:w.user_id,name:'Familiemedlem'"],
 ["$('miniLeague').innerHTML=html;", `$('miniLeague').innerHTML=html;
 for(const list of [$('league'),$('miniLeague')])list.querySelectorAll('.score').forEach((row,i)=>{
  const member=rank[i];if(!member)return;
  const span=row.querySelector('span');if(!span)return;
  const button=document.createElement('button');button.type='button';button.className='member-open';
  button.textContent=member.name+' · Se treningsøkter og bilder ›';
  button.addEventListener('click',()=>openMember(member.id,member.name));span.replaceWith(button);
 });`],
 ["window.addEventListener('error',", `function openMember(memberId,memberName){
 if(!family||!user)return;
 const familySessions=workouts.filter(w=>w.user_id===memberId&&!w.pending).sort((a,b)=>new Date(b.workout_date)-new Date(a.workout_date));
 $('memberTitle').textContent=memberName+' – treningsøkter';
 const html=familySessions.map(w=>{
  const activity=w.program_id==='ACTIVITY';
  const title=activity?(w.activity_type||'Annen trening'):(programs[w.program_id]?.name||w.program_id);
  const exercises=w.details?.exercises||[];const note=w.note||w.details?.note||'';
  const photoPaths=Array.isArray(w.photo_paths)?w.photo_paths:[];
  const img=photoPaths.map(path=>'<img class="history-photo" hidden data-photo-path="'+esc(path)+'" alt="Bilde fra treningsøkten" loading="lazy">').join('');
  const activityInfo=activity?'<p>'+esc(w.duration_minutes||0)+' minutter · '+esc(w.activity_type||'Annen trening')+'</p>':'';
  const exerciseInfo=!activity&&exercises.length?'<details class="history-details"><summary>Se øvelser og sett</summary><div class="history-body">'+exercises.map(historyExerciseHTML).join('')+'</div></details>':'';
  return '<article class="history-card"><div class="history-top"><div><h3 class="history-title">'+esc(title)+'</h3><div class="history-meta"><span class="badge">📅 '+new Date(w.workout_date).toLocaleDateString('no-NO')+'</span></div></div><div class="points-badge">+'+Number(w.points||0)+'</div></div>'+activityInfo+exerciseInfo+(note?'<div class="history-note"><strong>Notat:</strong> '+esc(note)+'</div>':'')+img+'</article>';
 }).join('');
 $('memberHistory').innerHTML=html||'<p>Ingen registrerte treningsøkter ennå.</p>';
 setPage('member');showHistoryPhotos();
}
$('memberBack').addEventListener('click',()=>setPage('league'));
window.addEventListener('error',`],
 ['</style>', `.member-open{display:block;background:transparent;color:var(--text);border:0;text-align:left;font-size:16px;line-height:1.4;padding:8px 0;min-height:44px;max-width:75%;cursor:pointer}.member-open:focus-visible{outline:2px solid var(--green);outline-offset:3px}.member-open:hover{color:var(--green)}
</style>`]
 ["workoutSets=p.exercises.map(name=>({name,done:false,sets:[{kg:'',reps:'',done:false}]}));renderWorkoutEditor();setPage('workout');","workoutSets=customExerciseNames(which).map(name=>({name,done:false,sets:[{kg:'',reps:'',done:false}]}));renderWorkoutEditor();setPage('workout');"],
 ["function startWorkout(which){","function exerciseStorageKey(which){return 'breiviks-exercises-v1-'+(user?.id||'guest')+'-'+which;}\nfunction customExerciseNames(which){try{const saved=JSON.parse(localStorage.getItem(exerciseStorageKey(which)));if(Array.isArray(saved))return saved.filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim()).slice(0,100);}catch(e){}return [...programs[which].exercises];}\nfunction persistExerciseNames(){if(!user)return;try{localStorage.setItem(exerciseStorageKey(workoutProgram),JSON.stringify(workoutSets.map(x=>x.name)));}catch(e){notify('Kunne ikke lagre øvelseslisten på denne enheten.',true);}}\nfunction renameExercise(index){const ex=workoutSets[index];if(!ex)return;const newName=prompt('Navn på øvelsen:',ex.name);if(newName===null)return;const cleaned=newName.trim().slice(0,100);if(!cleaned)return alert('Skriv inn et navn på øvelsen.');ex.name=cleaned;persistExerciseNames();renderWorkoutEditor();}\nfunction newExercise(){if(workoutSets.length>=100)return alert('Maks 100 øvelser i ett program.');const name=prompt('Navn på ny øvelse:');if(name===null)return;const cleaned=name.trim().slice(0,100);if(!cleaned)return alert('Skriv inn et navn på øvelsen.');workoutSets.push({name:cleaned,done:false,sets:[{kg:'',reps:'',done:false}]});persistExerciseNames();renderWorkoutEditor();}\nfunction startWorkout(which){"],
 ["<h3>'+esc(ex.name)+'</h3></div><button type=\"button\"","<h3>'+esc(ex.name)+'</h3><div class=\"btnrow exercise-edit-controls\"><button type=\"button\" class=\"tiny secondary\" data-rename=\"'+i+'\">✎ Endre navn</button><button type=\"button\" class=\"tiny secondary\" data-delete-exercise=\"'+i+'\">Fjern øvelse</button><button type=\"button\" class=\"tiny secondary\" data-move-up=\"'+i+'\" '+(i===0?'disabled':'')+'>↑</button><button type=\"button\" class=\"tiny secondary\" data-move-down=\"'+i+'\" '+(i===workoutSets.length-1?'disabled':'')+'>↓</button></div></div><button type=\"button\""],
 ["'</div><div class=\"exercise-actions\"><button type=\"button\" class=\"tiny secondary\" data-add=\"'+i+'\">+ Legg til sett</button>'+(ex.done?'<div class=\"exstatus\">✓ Ferdig</div>':'')+'</div></div>').join('');","'</div><div class=\"exercise-actions\"><button type=\"button\" class=\"tiny secondary\" data-add=\"'+i+'\">+ Legg til sett</button>'+(ex.done?'<div class=\"exstatus\">✓ Ferdig</div>':'')+'</div></div>').join('')+'<div class=\"exercise-add\"><button type=\"button\" id=\"addExercise\" class=\"secondary wide\">+ Legg til øvelse</button><p class=\"small\">Øvelsene er forslag. Endre navn, rekkefølge eller legg til flere når du trener.</p></div>';"],
 ["if(b.hasAttribute('data-copy-previous')){","if(b.id==='addExercise'){newExercise();return;}\n if(b.hasAttribute('data-rename')){renameExercise(Number(b.dataset.rename));return;}\n if(b.hasAttribute('data-delete-exercise')){const i=Number(b.dataset.deleteExercise);if(!confirm('Fjerne '+workoutSets[i].name+' fra programmet?'))return;workoutSets.splice(i,1);persistExerciseNames();renderWorkoutEditor();return;}\n if(b.hasAttribute('data-move-up')||b.hasAttribute('data-move-down')){const i=Number(b.dataset.moveUp??b.dataset.moveDown);const to=i+(b.hasAttribute('data-move-up')?-1:1);if(to>=0&&to<workoutSets.length){[workoutSets[i],workoutSets[to]]=[workoutSets[to],workoutSets[i]];persistExerciseNames();renderWorkoutEditor();}return;}\n if(b.hasAttribute('data-copy-previous')){"],
 ["#workoutPage textarea:focus-visible,#workoutPage input:focus-visible",".exercise-edit-controls{justify-content:flex-start;gap:5px;margin-top:9px}.exercise-edit-controls button{min-height:32px!important;padding:5px 8px!important;font-size:12px!important}.exercise-add{margin:20px 0 10px;padding:12px;border:1px dashed #4c6c72;border-radius:14px}\n#workoutPage textarea:focus-visible,#workoutPage input:focus-visible"],
];
async function start(){
 const status=document.getElementById('load-status'),button=document.getElementById('retry');
 button.hidden=true;status.className='';status.textContent='Åpner Styrkeloggen …';
 try{
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),15000);
  let response;
  try{response=await fetch(ORIGINAL,{signal:controller.signal,cache:'no-store'});}finally{clearTimeout(timeout);}
  if(!response.ok)throw Error('Kunne ikke hente originalappen ('+response.status+').');
  let source=await response.text();
  for(const [oldText,newText] of replacements){
   if(!source.includes(oldText))throw Error('Originalappen er ikke som forventet. Endringen er stoppet for å unngå feil.');
   source=source.split(oldText).join(newText);
  }
  if(!source.includes("activityBonusMinutes()>=20?5:0")||!source.includes("function openMember("))throw Error('Poengberegningen kunne ikke oppdateres.');
  document.open();document.write(source);document.close();
 }catch(error){status.className='error';status.textContent='Kunne ikke åpne Styrkeloggen: '+(error.message||error)+' Kontroller nettforbindelsen, og prøv igjen.';button.hidden=false;}
}
document.getElementById('retry').addEventListener('click',start);
start();
</script>
</body>
</html>
