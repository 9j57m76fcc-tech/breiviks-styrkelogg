<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breiviks styrkelogg</title>
<meta name="theme-color" content="#101827">
<style>body{background:#0d1524;color:#f4f8ff;font:16px/1.5 system-ui;margin:0;padding:28px}main{max-width:540px;margin:30px auto}h1{color:#69e1b7}p{color:#b8c5d6}.error{color:#ffb1ad}button{background:#69e1b7;padding:13px 20px;border:0;border-radius:12px;font-weight:bold}</style>
</head>
<body>
<main><h1>Breiviks styrkelogg 💪</h1><p id="load-status">Åpner Styrkeloggen …</p><button id="retry" type="button" hidden>Prøv igjen</button></main>
<script>
'use strict';
// Read the original, immutable application release, then apply the 20-minute rule.
// The original application stays intact, including its account and database settings.
const ORIGINAL='https://raw.githubusercontent.com/9j57m76fcc-tech/breiviks-styrkelogg/64536e94c852b1a04f8874c75bda3bc68ae00c85/index.html';
const replacements=[
 ['Hver registrerte aktivitet over 30 minutter gir 5 poeng.','Hver registrerte aktivitet på 20 minutter eller mer gir 5 poeng.'],
 ['Over 30 minutter gir 5 poeng.','20 minutter eller mer gir 5 poeng.'],
 ['Number(r.duration_minutes)>30?5:0','Number(r.duration_minutes)>=20?5:0'],
 ['activityBonusMinutes()>30?5:0','activityBonusMinutes()>=20?5:0'],
 ["duration>30?'Du får 5 poeng.':'Denne økten ga ingen poeng (30 minutter eller kortere).'","duration>=20?'Du får 5 poeng.':'Denne økten ga ingen poeng (under 20 minutter).'"],
 ["Number(w.duration_minutes)>30?'Aktivitetsbonus':'Kort økt'","Number(w.duration_minutes)>=20?'Aktivitetsbonus':'Kort økt'"]
];
async function start(){
 const status=document.getElementById('load-status'),button=document.getElementById('retry');
 button.hidden=true;status.className='';status.textContent='Åpner Styrkeloggen …';
 try{
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),15000);
  let response;
  try{response=await fetch(ORIGINAL,{signal:controller.signal,cache:'no-store'});}finally{clearTimeout(timeout);}
  if(!response.ok)throw Error('Kunne ikke hente originalappen ('+response.status+').');
  let source=await response.text();
  for(const [oldText,newText] of replacements){
   if(!source.includes(oldText))throw Error('Originalappen er ikke som forventet. Endringen er stoppet for å unngå feil.');
   source=source.split(oldText).join(newText);
  }
  if(!source.includes("activityBonusMinutes()>=20?5:0"))throw Error('Poengberegningen kunne ikke oppdateres.');
  document.open();document.write(source);document.close();
 }catch(error){status.className='error';status.textContent='Kunne ikke åpne Styrkeloggen: '+(error.message||error)+' Kontroller nettforbindelsen, og prøv igjen.';button.hidden=false;}
}
document.getElementById('retry').addEventListener('click',start);
start();
</script>
</body>
</html>
