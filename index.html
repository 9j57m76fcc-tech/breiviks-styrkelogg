 ["function renderProfile(){","function renderAwards(rank){\n const now=new Date(),year=now.getFullYear(),month=now.getMonth();\n const participants=rank.map(m=>({id:m.id,name:m.name}));\n const months=['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];\n function stats(y,m){const start=new Date(y,m===null?0:m,1).getTime(),end=new Date(y,m===null?12:m+1,1).getTime(),arr=participants.map(p=>({...p,points:0,sessions:0,minutes:0}));const byId=new Map(arr.map(x=>[x.id,x]));for(const w of workouts){const d=new Date(w.workout_date).getTime();if(d<start||d>=end||w.pending)continue;const p=byId.get(w.user_id);if(!p)continue;p.points+=Number(w.points||0);p.sessions++;p.minutes+=Number(w.duration_minutes||0);}return arr.sort((a,b)=>b.points-a.points||b.sessions-a.sessions||a.name.localeCompare(b.name,'no'));}\n function html(label,rows){if(!rows.some(x=>x.sessions))return '<p class=\"small\">'+esc(label)+': Ingen registrerte økter.</p>';const max=rows[0].points,winners=rows.filter(x=>x.points===max&&x.sessions>0);return '<h3>'+esc(label)+'</h3><p>🏆 '+(winners.length>1?'Delt førsteplass: ':'Vinner: ')+esc(winners.map(x=>x.name).join(' og '))+' ('+max+' poeng)</p>'+rows.map((m,i)=>'<div class=\"score\"><span>'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':'🏅')+' '+esc(m.name)+'<div class=\"small\">'+m.sessions+' økter'+(m.minutes?' · '+m.minutes+' registrerte minutter':'')+'</div></span><strong>'+m.points+' p</strong></div>').join('');}\n const previousMonth=new Date(year,month-1,1),py=previousMonth.getFullYear(),pm=previousMonth.getMonth(),monthRows=stats(py,pm),awardYear=(month===11&&now.getDate()===31)?year:year-1,yearRows=stats(awardYear,null);\n $('monthlyAwards').innerHTML=html(months[pm]+' '+py,monthRows);\n $('annualAwards').innerHTML=html('Årets treningsmester '+awardYear,yearRows);\n const banner=$('monthlyWinnerBanner'),message=$('monthlyWinnerMessage');\n if(monthRows.some(x=>x.sessions)){const lead=monthRows[0].points,winners=monthRows.filter(x=>x.points===lead&&x.sessions>0);banner.hidden=false;message.textContent=(winners.length>1?'Delt seier: ':'Gratulerer, ')+winners.map(x=>x.name).join(' og ')+'! '+lead+' poeng i '+months[pm]+'.';}else banner.hidden=true;\n let history='';for(let y=year;y>=year-5;y--){for(let m=11;m>=0;m--){if(y===year&&m>=month)continue;if(y===py&&m===pm)continue;const a=stats(y,m);if(!a.some(x=>x.sessions))continue;const win=a.filter(x=>x.points===a[0].points&&x.sessions>0);history+='<p>'+esc(months[m]+' '+y)+': 🏆 '+esc(win.map(x=>x.name).join(' og '))+' – '+a[0].points+' poeng</p>';}}\n $('awardHistory').innerHTML=history||'<p>Ingen tidligere månedsvinnere ennå.</p>';\n}\nfunction renderProfile(){"],

 ["function startWorkout(which){","function exerciseStorageKey(which){return 'breiviks-exercises-v1-'+(user?.id||'guest')+'-'+which;}\nfunction customExerciseNames(which){try{const saved=JSON.parse(localStorage.getItem(exerciseStorageKey(which)));if(Array.isArray(saved))return saved.filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim()).slice(0,100);}catch(e){}return [...programs[which].exercises];}\nfunction persistExerciseNames(){if(!user)return;try{localStorage.setItem(exerciseStorageKey(workoutProgram),JSON.stringify(workoutSets.map(x=>x.name)));}catch(e){notify('Kunne ikke lagre øvelseslisten på denne enheten.',true);}}\nfunction renameExercise(index){const ex=workoutSets[index];if(!ex)return;const newName=prompt('Navn på øvelsen:',ex.name);if(newName===null)return;const cleaned=newName.trim().slice(0,100);if(!cleaned)return alert('Skriv inn et navn på øvelsen.');ex.name=cleaned;persistExerciseNames();renderWorkoutEditor();}\nfunction newExercise(){if(workoutSets.length>=100)return alert('Maks 100 øvelser i ett program.');const name=prompt('Navn på ny øvelse:');if(name===null)return;const cleaned=name.trim().slice(0,100);if(!cleaned)return alert('Skriv inn et navn på øvelsen.');workoutSets.push({name:cleaned,done:false,sets:[{kg:'',reps:'',done:false}]});persistExerciseNames();renderWorkoutEditor();}\nfunction startWorkout(which){"],

async function start(){
 const status=document.getElementById('load-status'),button=document.getElementById('retry');
 button.hidden=true;status.className='';status.textContent='Åpner Styrkeloggen …';
 try{
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),15000);
  let response;
  try{response=await fetch(ORIGINAL,{signal:controller.signal,cache:'no-store'});}finally{clearTimeout(timeout);}
  if(!response.ok)throw Error('Kunne ikke hente originalappen ('+response.status+').');
  let source=await response.text();
  for(const [oldText,newText] of replacements){
   if(!source.includes(oldText))throw Error('Originalappen er ikke som forventet. Endringen er stoppet for å unngå feil.');
   source=source.split(oldText).join(newText);
  }

  // Persist each completed exercise to the existing workouts table. Never clear training history.
  source=source.replace('function startWorkout(which){', "\nfunction autosaveKey(){return 'breiviks-autosave-v1-'+(user?.id||'guest')+'-'+workoutProgram+'-'+($('workoutDate')?.value||today());}\nlet autosaveQueue=Promise.resolve();\nfunction exerciseSnapshot(){return workoutSets.map(ex=>({name:ex.name,done:!!ex.done,sets:ex.sets.map(s=>({kg:s.kg===''?null:Number(s.kg),reps:s.reps===''?null:Number(s.reps),done:!!s.done}))}));}\nfunction getAutosaveDraft(){try{const v=JSON.parse(localStorage.getItem(autosaveKey())||'null');return v&&v.user_id===user?.id&&v.family_id===family?.id?v:null;}catch{return null;}}\nfunction putAutosaveDraft(v){try{localStorage.setItem(autosaveKey(),JSON.stringify(v));}catch(e){showAutosaveStatus('Telefonen har ikke lagringsplass. Prøv igjen.',true);}}\nfunction showAutosaveStatus(msg,err){const el=$('exerciseAutosaveStatus');if(el){el.textContent=msg;el.style.color=err?'#ffb1ad':'#69e1b7';}}\nfunction restoreAutosaveDraft(){const saved=getAutosaveDraft();if(!saved)return;const list=saved.details?.exercises;if(!Array.isArray(list)||!list.length)return;workoutSets=list.map(ex=>({name:String(ex.name||'Øvelse'),done:!!ex.done,sets:(Array.isArray(ex.sets)&&ex.sets.length?ex.sets:[{}]).map(s=>({kg:s.kg==null?'':String(s.kg),reps:s.reps==null?'':String(s.reps),done:!!s.done}))}));$('workoutNote').value=saved.details?.note||'';showAutosaveStatus('Tidligere registrering er hentet frem.');}\nfunction persistPartialWorkout(){\n if(!user||!family)return Promise.resolve(false);\n const date=selectedWorkoutTimestamp('workoutDate');if(!date)return Promise.resolve(false);\n const exercises=exerciseSnapshot();\n const done=exercises.filter(ex=>ex.done&&ex.sets.some(s=>s.kg!==null||s.reps!==null));\n if(!done.length)return Promise.resolve(false);\n let draft=getAutosaveDraft();\n if(!draft)draft={id:uid(),family_id:family.id,user_id:user.id,program_id:workoutProgram,workout_date:date,points:workoutProgram==='BONUS'?5:10,details:{exercises:[],note:''},photo_paths:[],pending:true};\n draft.workout_date=date;draft.details={exercises,note:$('workoutNote').value.trim()};\n // Save on this phone before attempting a network write. The id stays the same on every update.\n putAutosaveDraft(draft);showAutosaveStatus('Lagrer ferdigmarkerte øvelser …');\n const entry=JSON.parse(JSON.stringify(draft));\n autosaveQueue=autosaveQueue.catch(()=>{}).then(async()=>{\n  const existing=workouts.find(w=>w.id===entry.id&&!w.pending);\n  const result=existing\n   ?await sb.from('workouts').update(makeWorkoutPayload(entry)).eq('id',entry.id).eq('user_id',user.id).select('id')\n   :await sb.from('workouts').insert(makeWorkoutPayload(entry)).select('id');\n  if(result.error)throw result.error;\n  const current=getAutosaveDraft();\n  if(current&&current.id===entry.id){current.pending=false;putAutosaveDraft(current);}\n  const ix=workouts.findIndex(w=>w.id===entry.id);\n  const record={...entry,pending:false};\n  if(ix>=0)workouts[ix]=record;else workouts.unshift(record);\n  renderAll();showAutosaveStatus('✓ Ferdige øvelser er lagret i familieloggen.');\n  return true;\n }).catch(err=>{\n  const current=getAutosaveDraft();\n  if(current&&current.id===entry.id){current.pending=true;putAutosaveDraft(current);}\n  showAutosaveStatus('Lagret på denne telefonen, men ikke i familieloggen. Prøv igjen med nett.',true);\n  return false;\n });\n return autosaveQueue;\n}\n"+'function startWorkout(which){');
  source=source.replace("renderWorkoutEditor();setPage('workout');", "restoreAutosaveDraft();renderWorkoutEditor();setPage('workout');");
  source=source.replace('<div id="exerciseFields"></div>', '<div id="exerciseFields"></div><p class="small" id="exerciseAutosaveStatus" aria-live="polite">Når du markerer en øvelse ferdig, lagres den automatisk.</p>');
  source=source.replace("ex.done=ex.sets.every(s=>s.done);renderWorkoutEditor();});", "ex.done=ex.sets.every(s=>s.done);renderWorkoutEditor();if(ex.done)persistPartialWorkout();});");
  source=source.replace("else return;renderWorkoutEditor();});", "else return;renderWorkoutEditor();if(b.hasAttribute('data-toggle')&&workoutSets[Number(b.dataset.toggle)]?.done)persistPartialWorkout();});");
  const saveStart=source.indexOf('async function saveWorkout(){'), saveEnd=source.indexOf('function allMy(){',saveStart);
  if(saveStart<0||saveEnd<0)throw Error('Fant ikke lagrefunksjonen. Ingen endring gjort.');
  source=source.slice(0,saveStart)+"async function saveWorkout(){\n if(!user||!family)return;\n const date=selectedWorkoutTimestamp('workoutDate');if(!date)return;\n const exercises=exerciseSnapshot();\n if(!exercises.some(ex=>ex.sets.some(s=>s.kg!==null||s.reps!==null)))return notify('Registrer minst ett sett før du lagrer.',true);\n const remaining=exercises.filter(ex=>!ex.done).length;\n if(remaining&&!confirm(remaining+' øvelse(r) er ikke ferdigmarkert. Vil du likevel fullføre økten?'))return;\n let draft=getAutosaveDraft();\n if(!draft)draft={id:uid(),family_id:family.id,user_id:user.id,program_id:workoutProgram,workout_date:date,points:workoutProgram==='BONUS'?5:10,photo_paths:[]};\n draft.workout_date=date;draft.details={exercises,note:$('workoutNote').value.trim()};\n const button=$('saveWorkout');button.disabled=true;\n try{\n  await autosaveQueue.catch(()=>{});\n  const photos=await uploadPhoto($('workoutPhoto').files?.[0],draft.id);\n  draft.photo_paths=[...(draft.photo_paths||[]),...photos];\n  const exists=workouts.some(w=>w.id===draft.id&&!w.pending);\n  const res=exists?await sb.from('workouts').update(makeWorkoutPayload(draft)).eq('id',draft.id).eq('user_id',user.id).select('id'):await sb.from('workouts').insert(makeWorkoutPayload(draft)).select('id');\n  if(res.error)throw res.error;\n  localStorage.removeItem(autosaveKey());\n  await loadData();setPage('home');notify('Bra jobbet! Økten er lagret 🎉');\n }catch(err){\n  draft.pending=true;putAutosaveDraft(draft);\n  notify('Økten er bevart på denne telefonen, men kunne ikke oppdateres i familieloggen: '+(err.message||err),true);\n }finally{button.disabled=false;}\n}\n"+source.slice(saveEnd);
  if(!source.includes('restoreAutosaveDraft();renderWorkoutEditor()')||!source.includes("if(ex.done)persistPartialWorkout()")||!source.includes("exerciseAutosaveStatus"))throw Error('Autosave ble ikke installert fullstendig.');

  if(!source.includes("activityBonusMinutes()>=20?5:0")||!source.includes("function openMember("))throw Error('Poengberegningen kunne ikke oppdateres.');
  document.open();document.write(source);document.close();
 }catch(error){status.className='error';status.textContent='Kunne ikke åpne Styrkeloggen: '+(error.message||error)+' Kontroller nettforbindelsen, og prøv igjen.';button.hidden=false;}
}
